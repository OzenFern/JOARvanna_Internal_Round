[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "0.2.0"
description = "Local-first debugger for silent failures in multi-step AI agents"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.22",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["blackbox*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
